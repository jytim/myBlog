{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if eq .Section "posts" }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ range .Params.tags }} · <span class="tag">#{{ . }}</span>{{ end }}</p>{{ end }}
  <div class="content">{{ .Content }}</div>
</article>
{{ end }}
